- name: "Install required packages"
  apt:
    name:
      - "python3"
      - "python3-pip"
      - "python3-venv"
      - "python3-setuptools"
    state: "present"
    update_cache: yes

- name: "Create application directory"
  file:
    path: "/opt/app"
    state: "directory"
    owner: "root"
    group: "root"
    mode: '0755'

- name: "Create virtual environment"
  command: "python3 -m venv /opt/app/venv"
  args:
    creates: "/opt/app/venv/bin/activate"

- name: "Install Python dependencies in venv"
  pip:
    name:
      - "flask"
      - "psycopg2-binary"
    virtualenv: "/opt/app/venv"

- name: "Copy app file"
  copy:
    src: "flaski.py"
    dest: "/opt/app/flaski.py"
    mode: '0755'
  notify: "Restart app"

- name: "Create systemd service file"
  template:
    src: "app.service.j2"
    dest: "/etc/systemd/system/app.service"
  notify:
    - "Reload systemd"
    - "Restart app"

- name: "Enable and start app service"
  service:
    name: "app"
    state: "started"
    enabled: yes
